name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  science-and-api:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false
      - name: Linux CAD/mesh shared libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgl1 libglu1-mesa libxrender1 libxext6
      - run: uv sync --locked --extra dev
      - run: uv run --no-sync pytest --junitxml=build/pytest-results.xml
      - name: Report test failures
        if: always()
        run: python scripts/summarize_tests.py build/pytest-results.xml
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: pytest-results-${{ matrix.os }}
          path: build/pytest-results.xml
          if-no-files-found: ignore
      - run: uv run --no-sync rocket-workbench --smoke-test

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm test
        working-directory: web
      - run: npm run build
        working-directory: web

  browser-workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: sudo apt-get update && sudo apt-get install -y libgl1 libglu1-mesa libxrender1 libxext6
      - run: uv sync --locked --extra dev --extra browser
      - run: uv run --no-sync playwright install --with-deps chromium
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: uv run --no-sync python scripts/browser_smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-workflow-evidence
          path: build/browser-smoke/
          if-no-files-found: ignore
