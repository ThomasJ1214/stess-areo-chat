name: Windows offline installer

on:
  workflow_dispatch:
  push:
    branches: ['main']
    tags: ['v*']

# Artifacts stay within this repository. This workflow does not publish a
# public release or change repository visibility.
permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked desktop, engineering and bundled CUDA libraries
        run: uv sync --locked --extra desktop --extra dev --extra gpu
      - name: Tests before packaging
        run: uv run --no-sync pytest --junitxml=build/pytest-results.xml
      - name: Report test failures
        if: always()
        run: python scripts/summarize_tests.py build/pytest-results.xml
      - name: Frontend dependency installation
        run: npm ci
        working-directory: web
      - name: Frontend tests
        run: npm test
        working-directory: web
      - name: Install Inno Setup when absent
        shell: pwsh
        run: |
          if (!(Test-Path 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe')) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Build and smoke-test the frozen application
        run: uv run --no-sync python scripts/build_windows.py
      - name: Test silent installation and installed calculation engine
        shell: pwsh
        run: |
          $installer = (Get-ChildItem release/*-setup.exe | Select-Object -First 1).FullName
          $installed = Join-Path $env:RUNNER_TEMP 'RocketWorkbench-installed'
          $installLog = Join-Path $env:RUNNER_TEMP 'RocketWorkbench-install.log'
          & ./scripts/windows_process_check.ps1 -FilePath $installer -ProcessArguments @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',('/DIR="' + $installed + '"'),('/LOG="' + $installLog + '"')) -TimeoutSeconds 600
          $manifest = Get-Content 'build/bundle_manifest.json' -Raw | ConvertFrom-Json
          $fileVersion = (Get-Item (Join-Path $installed 'RocketWorkbench.exe')).VersionInfo.ProductVersion
          if ($fileVersion -ne $manifest.application_version) { throw "Installed executable version '$fileVersion' does not match manifest" }
          $receipt = Join-Path (Get-Location).Path 'build/installed-engine-smoke.json'
          & ./scripts/windows_process_check.ps1 -FilePath (Join-Path $installed 'RocketWorkbench.exe') -ProcessArguments @('--smoke-test','--smoke-output',('"' + $receipt + '"')) -TimeoutSeconds 360
          $evidence = Get-Content $receipt -Raw | ConvertFrom-Json
          if ($evidence.status -ne 'ok' -or $evidence.fea_elements -le 0 -or $evidence.flight_samples -le 0) { throw 'Installed engine smoke receipt is incomplete' }
          Get-Content $receipt
      - name: Test installed native desktop, API session and WebGL viewport
        shell: pwsh
        env:
          # Hosted VMs have no workstation GPU. Test the complete graphics path
          # with software WebGL; this does not establish hardware GPU validation.
          QTWEBENGINE_CHROMIUM_FLAGS: '--disable-gpu-compositing --ignore-gpu-blocklist --enable-unsafe-swiftshader --use-gl=angle --use-angle=swiftshader'
        run: |
          $installed = Join-Path $env:RUNNER_TEMP 'RocketWorkbench-installed'
          $data = Join-Path $env:RUNNER_TEMP 'RocketWorkbench-desktop-smoke'
          try {
            & ./scripts/windows_process_check.ps1 -FilePath (Join-Path $installed 'RocketWorkbench.exe') -ProcessArguments @('--desktop-smoke-test','--data-dir',('"' + $data + '"')) -TimeoutSeconds 90
            Copy-Item (Join-Path $data 'application.log') 'build/installed-desktop-smoke.log'
          } catch {
            if (Test-Path (Join-Path $data 'application.log')) { Get-Content (Join-Path $data 'application.log') }
            throw
          }
      - name: Preserve packaging diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: RocketWorkbench-windows-build-diagnostics
          path: |
            build/pytest-results.xml
            ${{ runner.temp }}/RocketWorkbench-desktop-smoke/*.log
            ${{ runner.temp }}/RocketWorkbench-install.log
            ${{ runner.temp }}/rocket-workbench-smoke-error-*.log
            build/RocketWorkbench/warn-*.txt
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: RocketWorkbench-windows-x64-installer
          path: |
            release/*-setup.exe
            release/*.sha256
            release/*.txt
            build/bundle_manifest.json
            build/frozen-smoke.json
            build/installed-engine-smoke.json
            build/installed-desktop-smoke.log
          if-no-files-found: error
          retention-days: 30
