name: Verify existing Windows installer download

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Existing 0.3.0 Windows installer run to download and verify
        required: false
        default: '37934882324'
        type: string
  push:
    branches: ['verify-download/**']

# Read only this repository's existing artifact. Do not build or publish an app.
permissions:
  contents: read
  actions: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Validate requested source run
        id: source
        shell: pwsh
        env:
          REQUESTED_RUN_ID: ${{ inputs.source_run_id || '37934882324' }}
        run: |
          if ($env:REQUESTED_RUN_ID -notmatch '^[1-9][0-9]{0,19}$') {
            throw 'Source run ID must be a positive decimal GitHub Actions run ID.'
          }
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value ('run_id=' + $env:REQUESTED_RUN_ID)
      - name: Download the existing 0.3.0 installer artifact
        uses: actions/download-artifact@v4
        with:
          name: RocketWorkbench-windows-x64-installer
          run-id: ${{ steps.source.outputs.run_id }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          path: downloaded
      - name: Verify downloaded bytes and test a fresh installation
        shell: pwsh
        env:
          SOURCE_RUN_ID: ${{ steps.source.outputs.run_id }}
          # Hosted VM graphics are software WebGL, not physical GPU validation.
          QTWEBENGINE_CHROMIUM_FLAGS: '--disable-gpu-compositing --ignore-gpu-blocklist --enable-unsafe-swiftshader --use-gl=angle --use-angle=swiftshader'
        run: ./scripts/verify_windows_download.ps1 -ArtifactDirectory downloaded -OutputDirectory download-verification -SourceRunId $env:SOURCE_RUN_ID
      - name: Preserve compact download verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RocketWorkbench-0.3.0-download-verification
          path: download-verification/*
          if-no-files-found: warn
          retention-days: 30
