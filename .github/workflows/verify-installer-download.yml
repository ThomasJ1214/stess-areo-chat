name: Verify existing Windows installer download

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Existing Windows installer run to download and verify
        required: false
        default: '37985799359'
        type: string
      expected_version:
        description: Exact application version in the existing installer
        required: false
        default: '0.3.1'
        type: string
      expected_source_commit:
        description: Full clean source commit recorded in the installer manifest
        required: false
        default: 'da4baab51c99911bd648fd3de935c4c9f3033af6'
        type: string
  push:
    branches: ['verify-download/**']

# Read only this repository's existing artifact. Do not build or publish an app.
permissions:
  contents: read
  actions: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Validate requested source run and release identity
        id: source
        shell: pwsh
        env:
          REQUESTED_RUN_ID: ${{ inputs.source_run_id || '37985799359' }}
          REQUESTED_VERSION: ${{ inputs.expected_version || '0.3.1' }}
          REQUESTED_SOURCE_COMMIT: ${{ inputs.expected_source_commit || 'da4baab51c99911bd648fd3de935c4c9f3033af6' }}
        run: |
          if ($env:REQUESTED_RUN_ID -notmatch '^[1-9][0-9]{0,19}$') {
            throw 'Source run ID must be a positive decimal GitHub Actions run ID.'
          }
          if ($env:REQUESTED_VERSION -notmatch '^[0-9]+\.[0-9]+\.[0-9]+$') {
            throw 'Expected application version must contain three decimal version components.'
          }
          if ($env:REQUESTED_SOURCE_COMMIT -notmatch '^[a-fA-F0-9]{40}$') {
            throw 'Expected source commit must be a full hexadecimal Git commit ID.'
          }
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value ('run_id=' + $env:REQUESTED_RUN_ID)
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value ('version=' + $env:REQUESTED_VERSION)
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value ('source_commit=' + $env:REQUESTED_SOURCE_COMMIT.ToLowerInvariant())
      - name: Download the existing installer artifact
        uses: actions/download-artifact@v4
        with:
          name: RocketWorkbench-windows-x64-installer
          run-id: ${{ steps.source.outputs.run_id }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          path: downloaded
      - name: Verify downloaded bytes and test a fresh installation
        shell: pwsh
        env:
          SOURCE_RUN_ID: ${{ steps.source.outputs.run_id }}
          EXPECTED_VERSION: ${{ steps.source.outputs.version }}
          EXPECTED_SOURCE_COMMIT: ${{ steps.source.outputs.source_commit }}
          # Hosted VM graphics are software WebGL, not physical GPU validation.
          QTWEBENGINE_CHROMIUM_FLAGS: '--disable-gpu-compositing --ignore-gpu-blocklist --enable-unsafe-swiftshader --use-gl=angle --use-angle=swiftshader'
        run: ./scripts/verify_windows_download.ps1 -ArtifactDirectory downloaded -OutputDirectory download-verification -SourceRunId $env:SOURCE_RUN_ID -ExpectedVersion $env:EXPECTED_VERSION -ExpectedSourceCommit $env:EXPECTED_SOURCE_COMMIT
      - name: Preserve compact download verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RocketWorkbench-${{ steps.source.outputs.version }}-download-verification
          path: download-verification/*
          if-no-files-found: warn
          retention-days: 30
