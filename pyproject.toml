[build-system]
requires = ["setuptools==80.10.2", "wheel==0.46.3"]
build-backend = "setuptools.build_meta"

[project]
name = "rocket-workbench"
version = "0.1.1"
description = "Local Windows workbench for transparent high-power rocket engineering"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = [
  "fastapi==0.142.4",
  "pydantic==2.13.5",
  "numpy==2.5.3",
  "scipy==1.18.1",
  "trimesh==5.1.1",
  "cadquery-ocp==7.8.1.1.post1",
  "gmsh==4.15.2",
  "uvicorn==0.54.0",
  "python-multipart==0.0.32",
  "defusedxml==0.7.1",
]

[project.optional-dependencies]
desktop = ["PySide6==6.12.0"]
gpu = ["cupy-cuda12x[ctk]==14.2.0"]
dev = ["pytest==9.1.1", "httpx==0.28.1", "pyinstaller==6.22.3"]
browser = [
    "playwright==1.62.0",
]

[project.scripts]
rocket-workbench = "rocket_workbench.main:main"

[tool.setuptools.packages.find]
include = ["rocket_workbench*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.uv]
required-version = ">=0.9.0"
